<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .topbar {
    position: sticky;
    top: 0;
    background: #1a1a1a;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #333;
    z-index: 10;
  }
  .topbar a {
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .topbar .title {
    color: #fff;
    font-size: 14px;
    font-weight: 600;
  }

  .viewer-wrap {
    position: relative;
    width: 100%;
    height: calc(100vh - 45px - 56px); /* topbar + download bar */
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: #fff;
  }

  .downloadbar {
    height: 56px;
    background: #1a1a1a;
    border-top: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
  }

  .download-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #c0392b;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 8px;
    width: 100%;
    max-width: 420px;
    justify-content: center;
  }
  .download-btn:active {
    opacity: 0.8;
  }

  #fallback {
    display: none;
    color: #ccc;
    font-size: 14px;
    text-align: center;
    padding: 40px 16px;
  }
  #fallback a {
    color: #7ab8ff;
  }
</style>
</head>
<body>
  <div class="topbar">
    <a href="index.html">← 뒤로</a>
    <span class="title">추석 행사 카탈로그</span>
    <span style="width:40px;"></span>
  </div>

  <div class="viewer-wrap">
    <iframe
      src="https://docs.google.com/viewer?url=https://jungkwanjang.github.io/26_chuseok.pdf&embedded=true"
      title="추석 행사 카탈로그">
    </iframe>
  </div>

  <div class="downloadbar">
    <a class="download-btn" href="26_chuseok.pdf" download="2026_정관장_영동점_추석카탈로그.pdf">
      ⬇ PDF 다운로드
    </a>
  </div>

  <div id="fallback">
    화면이 보이지 않으면
    <a href="26_chuseok.pdf" target="_blank" rel="noopener">여기를 눌러 PDF를 직접 열어주세요</a>
  </div>
</body>
</html>
