<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>정관장 영동점 - 추석 행사 카탈로그</title>
    <!-- Google Analytics (GA4) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-B305JVPZ16"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-B305JVPZ16");
    </script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1a1a;
        font-family:
          -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Malgun Gothic", sans-serif;
      }
      .topbar {
        position: sticky;
        top: 0;
        background: #1a1a1a;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #333;
        z-index: 10;
      }
      .topbar a {
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .topbar .title {
        color: #fff;
        font-size: 14px;
        font-weight: 600;
      }

      .content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 60px 24px;
        color: #fff;
        min-height: calc(100vh - 45px - 120px);
      }

      .icon {
        font-size: 48px;
        margin-bottom: 16px;
      }

      .content h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }

      .content p {
        font-size: 14px;
        color: #aaa;
        margin: 0 0 28px;
        line-height: 1.6;
      }

      .download-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #c0392b;
        color: #fff;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
        padding: 14px 28px;
        border-radius: 8px;
        transition: opacity 0.15s ease;
      }
      .download-btn:active {
        opacity: 0.8;
      }

      .file-size {
        margin-top: 14px;
        font-size: 12px;
        color: #777;
      }

      .status {
        margin-top: 24px;
        font-size: 13px;
        color: #6cbf6c;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <a href="index.html">← 뒤로</a>
      <span class="title">추석 행사 카탈로그</span>
      <span style="width: 40px"></span>
    </div>

    <div class="content">
      <div class="icon">🎁</div>
      <h1>2026 추석 정관장 상품안내장</h1>
      <p>버튼을 누르면 카탈로그 PDF 파일이<br />기기에 다운로드됩니다.</p>

      <a
        id="dlBtn"
        class="download-btn"
        href="26_chuseok.pdf"
        download="2026_정관장_영동점_추석카탈로그.pdf"
      >
        ⬇ 카탈로그 다운로드
      </a>

      <div class="file-size">파일 용량 약 62MB · PDF</div>
      <div class="status" id="status"></div>
    </div>

    <script>
      // 페이지 진입 시 자동으로 다운로드 시도 (일부 인앱 브라우저는 자동 다운로드를 막을 수 있어
      // 위의 수동 버튼을 항상 함께 제공합니다)
      window.addEventListener("load", function () {
        var statusEl = document.getElementById("status");
        try {
          var a = document.createElement("a");
          a.href = "26_chuseok.pdf";
          a.download = "2026_정관장_영동점_추석카탈로그.pdf";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          statusEl.textContent =
            "다운로드가 시작되었습니다. 진행되지 않으면 위 버튼을 다시 눌러주세요.";
        } catch (e) {
          // 자동 다운로드 실패 시 조용히 무시 — 수동 버튼으로 대체
        }
      });
    </script>
  </body>
</html>
